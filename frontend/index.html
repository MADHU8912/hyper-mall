<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyper Mall Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    pre {
      background: black;
      height: 200px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h1>🚀 Hyper Mall Dashboard</h1>

<!-- 🟢 Status -->
<div class="card">
  <h2>Status</h2>
  <p id="status">Connecting...</p>
</div>

<!-- 🔴 Docker Logs -->
<div class="card">
  <h2>🔴 Docker Logs</h2>
  <pre id="dockerLogs">Waiting...</pre>
</div>

<!-- ⚙️ Jenkins Logs -->
<div class="card">
  <h2>⚙️ Jenkins Logs</h2>
  <pre id="jenkinsLogs">Waiting...</pre>
</div>

<!-- 📊 Chart -->
<div class="card">
  <h2>📊 Build Chart</h2>
  <canvas id="chart"></canvas>
</div>

<script>
const ws = new WebSocket("ws://localhost:11000");

let chart;

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);

  // 🔴 Docker logs
  if (data.type === "docker") {
    const el = document.getElementById("dockerLogs");
    el.innerText = data.data;
    el.scrollTop = el.scrollHeight;
  }

  // ⚙️ Jenkins logs
  if (data.type === "jenkins") {
    const el = document.getElementById("jenkinsLogs");
    el.innerText = data.data;
    el.scrollTop = el.scrollHeight;
  }

  // 🟢 Status
  if (data.type === "status") {
    document.getElementById("status").innerText = data.data;
  }

  // 📊 Chart (optional if backend sends)
  if (data.type === "chart") {
    const ctx = document.getElementById("chart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.data.map(d => d.build),
        datasets: [{
          label: 'Builds',
          data: data.data.map(d => d.status)
        }]
      }
    });
  }
};

ws.onerror = () => {
  document.getElementById("status").innerText = "Connection Error";
};

ws.onopen = () => {
  document.getElementById("status").innerText = "Connected";
};
</script>

</body>
</html>
