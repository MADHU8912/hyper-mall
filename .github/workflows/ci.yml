name: Hyper Mall CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build Step
      run: echo "Build Success" > build.txt

    - name: Create Report
      run: |
        echo "Build OK" > report.txt

    - name: Generate Status JSON
      run: |
        echo '{ "build": "SUCCESS", "report": "OK", "deploy": "PENDING" }' > frontend/status.json

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend
